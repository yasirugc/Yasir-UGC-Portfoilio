
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yasir UGC Creator Portfolio">
  <title>Yasir | UGC Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 40px 24px 70px;
    }

    header {
      text-align: center;
      padding: 40px 0 50px;
      border-bottom: 1px solid #e8e8e8;
    }

    h1 {
      font-size: clamp(60px, 10vw, 100px);
      font-weight: 700;
      letter-spacing: -5px;
      margin: 0;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #777777;
      margin-top: 12px;
    }

    section {
      padding-top: 55px;
    }

    h2 {
      font-size: 28px;
      letter-spacing: -1px;
      margin: 0 0 25px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .video-card {
      min-width: 0;
    }

    .video-card video {
      display: block;
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      background: #eeeeee;
      border-radius: 12px;
    }

    .video-title {
      font-size: 14px;
      font-weight: 600;
      margin: 13px 0 0;
      line-height: 1.4;
    }

    .contact {
      margin-top: 60px;
      padding: 35px 0;
      border-top: 1px solid #e8e8e8;
    }

    .contact p {
      font-size: 16px;
      line-height: 1.8;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .contact a {
      color: #171717;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #999999;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .videos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 18px 45px;
      }

      header {
        padding: 30px 0 40px;
      }

      h1 {
        letter-spacing: -3px;
      }

      .videos {
        gap: 12px;
      }

      .video-title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Yasir</h1>
      <div class="subtitle">UGC Creator</div>
    </header>

    <main>

      <section id="work">
        <h2>My Work</h2>

        <div class="videos">

          <!-- VIDEO 1 -->
          <div class="video-card">
            <video controls playsinline preload="metadata">
              <source src="video1.mp4" type="video/mp4">
              Your browser does not support video playback.
            </video>
            <p class="video-title">
              Lifestyle Content
            </p>
          </div>

          <!-- VIDEO 2 -->
          <div class="video-card">
            <video controls playsinline preload="metadata">
              <source src="video2.mp4" type="video/mp4">
              Your browser does not support video playback.
            </video>
            <p class="video-title">
              Fashion & Styling
            </p>
          </div>

          <!-- VIDEO 3 -->
          <div class="video-card">
            <video controls playsinline preload="metadata">
              <source src="video3.mp4" type="video/mp4">
              Your browser does not support video playback.
            </video>
            <p class="video-title">
              Fitness & Product Showcase
            </p>
          </div>

          <!-- VIDEO 4 -->
          <div class="video-card">
            <video controls playsinline preload="metadata">
              <source src="video4.mp4" type="video/mp4">
              Your browser does not support video playback.
            </video>
            <p class="video-title">
              Home & Lifestyle
            </p>
          </div>

        </div>
      </section>

      <section class="contact" id="contact">
        <h2>Contact</h2>

        <p>
          <strong>TikTok:</strong>
          <a href="https://www.tiktok.com/@yasirbonded"
             target="_blank"
             rel="noopener noreferrer">
            @YasirBonded
          </a>
        </p>

        <p>
          <strong>Email:</strong>
          <a href="mailto:Yasiryusufa2020@gmail.com">
            Yasiryusufa2020@gmail.com
          </a>
        </p>
      </section>

    </main>

    <footer>
      © 2026 Yasir | UGC Creator
    </footer>

  </div>

</body>
</html>
